- insert:
    - id: mcp-huddo
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: huddo
        transport: stdio
        command: npx
        args:
          - -y
          - huddoai@0.8.0
          - mcp
        env:
          HUDDO_DAEMON: '0'
        toolCallTimeoutMs: 120000
    - id: huddo-skill
      name: dsh-huddo
